events {}
http {
    server_tokens off;
    access_log off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 8086;
        client_max_body_size 256k;
        location = /api/mail/webhooks/resend {
            if ($request_method != POST) { return 405; }
            set $upstream http://mindbridge-agent:8080;
            proxy_pass $upstream;
            proxy_set_header Host mindbridge-agent;
            proxy_set_header Authorization "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
        }
        location / { return 404; }
    }
}
